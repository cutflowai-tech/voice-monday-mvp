[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-monday-agent"
version = "0.1.0"
description = "Egyptian Arabic phone assistant: Asterisk ARI -> intent -> durable job -> Monday.com"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1.0",
  "httpx>=0.27,<1",
  "redis>=5.0,<7",
  "websockets>=13.0",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.1"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "fakeredis>=2.23",
  "ruff>=0.6",
]

[project.scripts]
voice-agent = "voice_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voice_agent = ["py.typed", "people.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: hits real external APIs; skipped unless explicitly enabled",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # Arabic text intentionally contains "ambiguous" unicode
  "S101",                        # asserts are fine in tests
  "S311",                        # random is used for wording variety, not crypto
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "E501"]
